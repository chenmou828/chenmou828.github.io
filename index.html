<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮箱工具面板</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body {
    background: linear-gradient(135deg,#0f172a,#111827);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #e5e7eb;
}

.container {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 28px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 6px;
    color: #fff;
}

.sub {
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 22px;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: #cbd5e1;
}

input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: white;
    outline: none;
    transition: 0.2s;
}

input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
}

.interface-select {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.interface-select label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.03);
    cursor: pointer;
    font-size: 13px;
}

.interface-select label:hover {
    background: rgba(255,255,255,0.08);
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg,#3b82f6,#2563eb);
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(59,130,246,0.35);
}

.result-area {
    margin-top: 18px;
    background: #0b1220;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px;
    max-height: 260px;
    overflow-y: auto;
}

.log-item {
    font-family: monospace;
    font-size: 12px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.log-success { color: #22c55e; }
.log-error { color: #ef4444; }
.log-info { color: #38bdf8; }

.footer {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #64748b;
}
</style>
</head>

<body>

<div class="container">
    <h1>邮箱工具面板</h1>
    <div class="sub">UI优化版本 · 更清爽</div>

    <form method="POST" action="">
        <div class="form-group">
            <label>QQ邮箱</label>
            <input type="email" name="email" placeholder="123456@qq.com" required>
        </div>

        <div class="form-group">
            <label>选择接口</label>
            <div class="interface-select">
                <label><input type="radio" name="interface" value="1" checked> 接口1</label>
                <label><input type="radio" name="interface" value="2"> 接口2</label>
                <label><input type="radio" name="interface" value="3"> 接口3</label>
            </div>
        </div>

        <div class="form-group">
            <label>发送次数</label>
            <input type="number" name="times" min="1" max="30" value="1">
        </div>

        <button type="submit">开始执行</button>
    </form>

    <div class="result-area">
        <div class="log-item log-info">[系统] 等待执行任务...</div>
        <div class="log-item log-success">[接口] UI加载完成</div>
        <div class="log-item log-error">[提示] 当前为静态页面</div>
    </div>

    <div class="footer">2026 Panel UI</div>
</div>

</body>
</html>
