<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱测压 · Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e2937);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 540px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #60a5fa, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
            outline: none;
        }
        .interface-select {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .interface-select label {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .interface-select label:hover {
            background: rgba(96, 165, 250, 0.15);
            border-color: #60a5fa;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-start {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .btn-stop {
            background: #ef4444;
            color: white;
            display: none;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59,130,246,0.4);
        }
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        .progress {
            height: 6px;
            background: #334155;
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a5b4fc);
            width: 0%;
            transition: width 0.4s ease;
        }
        .result-area {
            margin-top: 24px;
            background: #0f172a;
            border: 1px solid rgba(148,163,184,0.1);
            border-radius: 16px;
            padding: 16px;
            max-height: 380px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 13.5px;
        }
        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
        .log-info { color: #60a5fa; }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #475569;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>邮箱测压</h1>
    <div class="sub">官方频道 @taxd520</div>

    <form id="emailForm" method="POST" action="">
        <div class="form-group">
            <label>目标 QQ邮箱</label>
            <input type="email" name="email" placeholder="123456@qq.com" required>
        </div>

        <div class="form-group">
            <label>选择接口</label>
            <div class="interface-select">
                <label><input type="radio" name="interface" value="1" checked> 接口1</label>
                <label><input type="radio" name="interface" value="2"> 接口2</label>
                <label><input type="radio" name="interface" value="3"> 接口3</label>
            </div>
        </div>

        <div class="form-group">
            <label>发送次数 (1-30)</label>
            <input type="number" name="times" value="5" min="1" max="30" required>
        </div>

        <button type="submit" class="btn-start" id="startBtn">开始测压</button>
        <button type="button" class="btn-stop" id="stopBtn">停止测压</button>
    </form>

    <div class="progress-container" id="progressContainer">
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="result-area" id="resultArea">
        <div class="log-item log-info">[系统] 面板已就绪，等待执行...</div>
    </div>

    <div class="footer">2026 Enhanced UI</div>
</div>

<script>
    const form = document.getElementById('emailForm');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resultArea = document.getElementById('resultArea');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    let isRunning = false;

    function addLog(message, type = 'info') {
        const log = document.createElement('div');
        log.className = `log-item log-${type}`;
        log.textContent = message;
        resultArea.appendChild(log);
        resultArea.scrollTop = resultArea.scrollHeight;
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (isRunning) return;
        
        isRunning = true;
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        progressContainer.style.display = 'block';
        
        addLog('[系统] 开始执行测压任务...', 'info');
        
        // 这里模拟进度（实际应由后端通过 AJAX 返回实时状态）
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 12;
            if (progress > 100) progress = 100;
            progressBar.style.width = progress + '%';
            
            if (progress > 95) {
                clearInterval(interval);
            }
        }, 180);
    });

    stopBtn.addEventListener('click', () => {
        isRunning = false;
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        progressContainer.style.display = 'none';
        addLog('[系统] 用户已手动停止任务', 'error');
    });

    // 清空初始日志
    setTimeout(() => {
        resultArea.innerHTML = '<div class="log-item log-success">[系统] UI初始化完成 ✓</div>';
    }, 800);
</script>
</body>
</html>
