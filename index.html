
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱测压</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px 20px; color: #1e293b; }
        .container { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; padding: 32px 28px; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; color: #0f172a; }
        .sub { color: #64748b; font-size: 14px; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid #eef2f6; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 8px; color: #334155; }
        input { width: 100%; padding: 12px 16px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 12px; background: #ffffff; transition: 0.2s; outline: none; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        button { background: #3b82f6; color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 40px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        button:hover { background: #2563eb; }
        .result-area { margin-top: 28px; background: #f8fafc; border-radius: 16px; padding: 18px; border: 1px solid #eef2f6; max-height: 450px; overflow-y: auto; }
        .log-item { font-family: monospace; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #e6edf4; }
        .log-success { color: #0f7b3a; }
        .log-error { color: #dc2626; }
        .log-info { color: #3b82f6; }
        .log-response { color: #6b7280; font-size: 11px; padding-left: 20px; word-break: break-all; }
        .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #94a3b8; }
        .interface-select { display: flex; gap: 12px; flex-wrap: wrap; }
        .interface-select label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .interface-select label:hover { background: #eef2f6; }
        .interface-select input[type="radio"] { width: auto; margin: 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>邮箱测压</h1>
    <div class="sub">官方频道@taxd520and@chenmou114514</div>

    <form method="POST" action="">
        <div class="form-group">
            <label>QQ邮箱</label>
            <input type="email" name="email" placeholder="如 123456@qq.com" value="" required>
        </div>
        <div class="form-group">
            <label>选择接口</label>
            <div class="interface-select">
                <label><input type="radio" name="interface" value="1" checked> 接口1</label>
                <label><input type="radio" name="interface" value="2" > 接口2</label>
                <label><input type="radio" name="interface" value="3" > 接口3</label>
            </div>
        </div>
        <div class="form-group">
            <label>发送次数 (1-30)</label>
            <input type="number" name="times" value="1" min="1" max="30" step="1" required>
        </div>
        <button type="submit">开始发送</button>
    </form>

        <div class="footer">2026 </div>
</div>
</body>
</html>
